# Static server for tolon.<domain>, mounted as /etc/nginx/conf.d/default.conf in nginxinc/nginx-unprivileged.

# Rate-limit key: the visitor address Cloudflare passes on (only cloudflared can reach this container).
map $http_cf_connecting_ip $limit_key {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $limit_key zone=perip:10m rate=30r/s;
limit_req_status 429;

# Cache-Control: pages and unstamped css/js/json are revalidated; files requested with ?v=<hash>
# (tools/stamp-assets.mjs) are immutable; fonts and images keep the edge default.
map $arg_v $stamped { ""  0; default 1; }
map "$stamped:$uri" $cache_control {
    default                                    "";
    "~^[01]:(.*/)?[^./]*$"                     "no-cache";
    "~*^[01]:.*\.html$"                        "no-cache";
    "~^1:"                                     "public, max-age=31536000, immutable";
    "~*^0:.*\.(css|js|mjs|json)$"              "no-cache";
}

# No access log with addresses or user agents.
log_format minimal '$time_iso8601 $request_method $uri $status $body_bytes_sent';
access_log /dev/stdout minimal;

server_tokens off;
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 512;

server {
    listen 8080;
    server_name _;
    root /web;
    index index.html;
    absolute_redirect off; # behind the tunnel, the container port must not leak into redirects

    limit_req zone=perip burst=100 nodelay;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always; # no includeSubDomains: other subdomains exist
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), bluetooth=(), camera=(), clipboard-read=(), clipboard-write=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), interest-cohort=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=()" always;
    add_header Cache-Control $cache_control; # an empty value adds no header; no other add_header below, they would replace these

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /api/ { return 404; }
    location ^~ /pool { return 302 /; } # the old poll and results paths
    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri $uri/index.html =404;
    }
}
