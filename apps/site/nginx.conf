# Static server for danielpsf.net (personal site), mounted as /etc/nginx/conf.d/default.conf in nginxinc/nginx-unprivileged.
# Rate-limit key: the visitor address Cloudflare passes on (only cloudflared can reach this container).
map $http_cf_connecting_ip $limit_key {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $limit_key zone=siteperip:10m rate=20r/s;
limit_req_status 429;
# Pages revalidate; css 1 h; fonts, images and PDFs 7 d (file names are not hash-stamped).
map $uri $cache_control {
    default                                  "no-cache";
    "~*\.css$"                               "public, max-age=3600";
    "~*\.(woff2|webp|jpg|png|svg|pdf)$"      "public, max-age=604800";
}
log_format minimal '$time_iso8601 $request_method $uri $status $body_bytes_sent';
access_log /dev/stdout minimal;
server_tokens off;
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
gzip_min_length 512;
server {
    listen 8080;
    server_name _;
    root /web;
    index index.html;
    absolute_redirect off; # behind the tunnel, the container port must not leak into redirects
    limit_req zone=siteperip burst=60 nodelay;
    if ($host = "www.danielpsf.net") { return 301 https://danielpsf.net$request_uri; }
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-vQYTQRYzcqfcDtzTTW6UmnteciQip7hyKGT7tLBs38w=' 'sha256-6k+et/0FIzH0t2+ExyIsps12rZ5VsQ4bNvEb1oeMoyE='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always; # no includeSubDomains: other subdomains exist
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), bluetooth=(), camera=(), clipboard-read=(), clipboard-write=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), interest-cohort=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=()" always;
    add_header Cache-Control $cache_control; # no add_header in locations below, they would reset these
    error_page 404 /404.html;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    # old CV file names (before 2026-11-23) keep working
    location = /cv/Daniel_Fernandes_CV_Generic_enUS.pdf { return 301 /cv/daniel_cv_enUS.pdf; }
    location = /cv/Daniel_Fernandes_CV_Generic_ptBR.pdf { return 301 /cv/daniel_cv_ptBR.pdf; }
    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri $uri/index.html =404;
    }
}
